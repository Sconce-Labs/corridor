name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stellar:
    name: Stellar / Soroban
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar
      - name: Unit tests (host)
        run: cargo test --workspace --locked
      - name: Contract wasm build
        run: cargo build --workspace --locked --release --target wasm32v1-none

  circuits:
    name: Noir circuit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits/corridor_eligibility
    steps:
      - uses: actions/checkout@v4
      - name: Install Noir
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - run: noirup
      - name: Type-check
        run: nargo check
      - name: Circuit tests
        run: nargo test

  midnight:
    name: Midnight / Compact
    runs-on: ubuntu-latest
    # The Compact contract is written but not yet API-verified against
    # CompactStandardLibrary — see ROADMAP.md M4. Non-blocking until then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: midnightntwrk/setup-compact-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile credential registry
        run: compact compile contracts/corridor.compact contracts/managed/corridor
