name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile contract
        run: compact compile contracts/counter.compact contracts/managed/counter

      - name: Run tests
        run: npm test
