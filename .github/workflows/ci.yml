name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Soroban contracts and the Noir circuit have their own CI in
# Sconce-Labs/corridor-contracts and Sconce-Labs/corridor-circuits.
# This repo's CI covers the Midnight contract, the web frontend, and doc
# link hygiene.

jobs:
  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  midnight:
    name: Midnight / Compact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: midnightntwrk/setup-compact-action@v1
      - name: Compile the issuer registry
        run: compact compile contracts/corridor.compact contracts/managed/corridor
      - name: Verify the compiled ZK keyset
        run: |
          set -e
          test -f contracts/managed/corridor/contract/index.js
          test -f contracts/managed/corridor/contract/index.d.ts
          node -e '
            const info = require("./contracts/managed/corridor/compiler/contract-info.json");
            const want = ["initAdmin","registerIssuer","deregisterIssuer","bumpEpoch","adminBumpEpoch","reportAttestations"];
            const got = info.circuits.map(c => c.name ?? c);
            for (const c of want) if (!got.includes(c)) { console.error("missing circuit:", c); process.exit(1); }
            const fs = require("fs");
            for (const c of want) {
              for (const ext of ["prover","verifier"])
                if (!fs.existsSync(`contracts/managed/corridor/keys/${c}.${ext}`)) { console.error("missing key:", c, ext); process.exit(1); }
            }
            console.log("6 circuits, 12 keys — OK");
          '
      - name: Typecheck the deploy tooling
        run: npm ci && npm run typecheck

  links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links resolve
        run: |
          miss=$(
            for f in $(git ls-files '*.md'); do
              d=$(dirname "$f")
              grep -oE '\]\(\.{1,2}/[^)#]+' "$f" | sed 's/^](//' | while read -r rel; do
                [ -e "$d/$rel" ] || echo "$f -> $rel"
              done
            done
          )
          if [ -n "$miss" ]; then echo "$miss"; exit 1; fi
