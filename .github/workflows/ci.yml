name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Soroban contracts and the Noir circuit have their own CI in
# Sconce-Labs/corridor-contracts and Sconce-Labs/corridor-circuits.
# This repo's CI covers the Midnight contract, the web frontend, and doc
# link hygiene.

jobs:
  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  midnight:
    name: Midnight / Compact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: midnightntwrk/setup-compact-action@v1
      - name: Compile credential registry
        run: compact compile contracts/corridor.compact contracts/managed/corridor

  links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links resolve
        run: |
          miss=$(
            for f in $(git ls-files '*.md'); do
              d=$(dirname "$f")
              grep -oE '\]\(\.{1,2}/[^)#]+' "$f" | sed 's/^](//' | while read -r rel; do
                [ -e "$d/$rel" ] || echo "$f -> $rel"
              done
            done
          )
          if [ -n "$miss" ]; then echo "$miss"; exit 1; fi
